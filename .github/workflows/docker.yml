name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-node22-turbo-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-turbo-v1-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build --filter=@vben/web-antd
        env:
          TZ: Asia/Shanghai

      # 只发送静态产物，避免上传 node_modules 和导出庞大的构建中间层。
      - name: Prepare Docker context
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-image"
          cp -R apps/web-antd/dist "$RUNNER_TEMP/frontend-image/dist"
          cp scripts/deploy/nginx.conf "$RUNNER_TEMP/frontend-image/nginx.conf"
          cp scripts/deploy/Dockerfile.runtime "$RUNNER_TEMP/frontend-image/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/frontend-image
          file: ${{ runner.temp }}/frontend-image/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name != 'pull_request' && format('{0}/{1}/aio-life-front:latest', env.ACR_REGISTRY, env.ACR_NAMESPACE) || '' }}
            ${{ github.event_name != 'pull_request' && format('{0}/{1}/aio-life-front:{2}', env.ACR_REGISTRY, env.ACR_NAMESPACE, github.sha) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭 provenance/sbom 证明：buildx 默认生成的 OCI attestation 清单
          # （application/vnd.oci.empty.v1+json）会被阿里云 ACR 拒绝，
          # 报 unknown manifest class
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend-runtime
          cache-to: type=gha,scope=frontend-runtime,mode=min
